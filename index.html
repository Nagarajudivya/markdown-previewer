<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Previewer</title>

    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 20px;
            color: #333;
        }

        h1.title {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background: #667eea;
            color: white;
            padding: 12px 18px;
            font-weight: bold;
        }

        #editor {
            width: 100%;
            min-height: 520px;
            padding: 18px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        #preview {
            padding: 18px;
            min-height: 520px;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        #preview h1, #preview h2 { border-bottom: 2px solid #eee; padding-bottom: 6px; margin: 16px 0 10px; }
        #preview p, #preview ul, #preview ol { margin: 10px 0; }
        #preview ul, #preview ol { padding-left: 28px; }
        #preview a { color: #4c51bf; }
        #preview img { max-width: 100%; }
        #preview blockquote { border-left: 5px solid #667eea; padding-left: 14px; color: #555; margin: 12px 0; }
        #preview code { background: #f1f1f8; padding: 2px 6px; border-radius: 4px; font-family: Consolas, monospace; }
        #preview pre { background: #2d2d3a; color: #f8f8f2; padding: 14px; border-radius: 8px; overflow-x: auto; }
        #preview pre code { background: none; padding: 0; color: inherit; }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
            #editor, #preview { min-height: 300px; }
        }
    </style>
</head>
<body>

<h1 class="title">Markdown Previewer</h1>
<div id="root"></div>

<script type="text/babel">

    // Default markdown (built from lines to avoid escaping backticks)
    const defaultMarkdown = [
        "# Welcome to my Markdown Previewer!",
        "",
        "## This is a sub-heading...",
        "### And here's some other cool stuff:",
        "",
        "Heres some code, `<div></div>`, between 2 backticks.",
        "",
        "```",
        "// this is multi-line code:",
        "",
        "function anotherExample(firstLine, lastLine) {",
        "  if (firstLine == '```' && lastLine == '```') {",
        "    return multiLineCode;",
        "  }",
        "}",
        "```",
        "",
        "You can also make text **bold**... whoa!",
        "Or _italic_.",
        "Or... wait for it... **_both!_**",
        "And feel free to go crazy ~~crossing stuff out~~.",
        "",
        "There's also [links](https://www.freecodecamp.org), and",
        "> Block Quotes!",
        "",
        "And if you want to get really crazy, even tables:",
        "",
        "Wild Header | Crazy Header | Another Header?",
        "------------ | ------------- | -------------",
        "Your content can | be here, and it | can be here....",
        "And here. | Okay. | I think we get it.",
        "",
        "- And of course there are lists.",
        "  - Some are bulleted.",
        "     - With different indentation levels.",
        "        - That look like this.",
        "",
        "1. And there are numbered lists too.",
        "1. Use just 1s if you want!",
        "1. And last but not least, let's not forget embedded images:",
        "",
        "![freeCodeCamp Logo](https://cdn.freecodecamp.org/testable-projects-fcc/images/fcc_secondary.svg)"
    ].join("\n");

    // GitHub flavored markdown + carriage returns become <br>
    marked.setOptions({ gfm: true, breaks: true });

    function App() {
        const [text, setText] = React.useState(defaultMarkdown);

        return (
            <div className="container">
                <div className="panel">
                    <div className="panel-header">Editor</div>
                    <textarea
                        id="editor"
                        value={text}
                        onChange={(e) => setText(e.target.value)}
                    />
                </div>

                <div className="panel">
                    <div className="panel-header">Preview</div>
                    <div
                        id="preview"
                        dangerouslySetInnerHTML={{ __html: marked.parse(text) }}
                    />
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById("root"));

</script>

<script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
</body>
</html>
